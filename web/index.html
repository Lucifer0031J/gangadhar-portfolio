<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gangadhar Poosarla - Application Security Engineer Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Gangadhar Poosarla - Portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- J.A.R.V.I.S. British Neural Voice Synthesis Engine -->
  <script>
    (function() {
      let cachedBritishVoice = null;

      function findBritishVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;

        // Preferred UK / British male neural voices (Paul Bettany / J.A.R.V.I.S. cadence)
        const priorityNames = [
          'ryan', 'george', 'oliver', 'daniel', 'uk english male', 'arthur', 'alfie', 'natural'
        ];

        for (const name of priorityNames) {
          const match = voices.find(v => 
            (v.lang === 'en-GB' || v.lang === 'en_GB') && 
            v.name.toLowerCase().includes(name)
          );
          if (match) return match;
        }

        // Any en-GB voice
        const anyGb = voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB' || v.lang.startsWith('en-GB'));
        if (anyGb) return anyGb;

        // Any male English voice
        const anyMale = voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes('male'));
        if (anyMale) return anyMale;

        // Fallback to any English voice
        return voices.find(v => v.lang.startsWith('en')) || voices[0] || null;
      }

      function initVoices() {
        if (!('speechSynthesis' in window)) return;
        cachedBritishVoice = findBritishVoice();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = function() {
            cachedBritishVoice = findBritishVoice();
          };
        }
      }

      function playStarkChime() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.14);
        } catch (_) {}
      }

      if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
        initVoices();
      }

      let currentAudio = null;

      const audioMap = {
        'welcome to stark tower': 'assets/audio/welcome.mp3',
        'protocol 42': 'assets/audio/about.mp3',
        'indian stark': 'assets/audio/about.mp3',
        'built different': 'assets/audio/about.mp3',
        'tactical operational': 'assets/audio/skills.mp3',
        'telemetry': 'assets/audio/skills.mp3',
        'target acquired': 'assets/audio/bounty.mp3',
        'thirty critical': 'assets/audio/bounty.mp3',
        'intellectual property': 'assets/audio/credentials.mp3',
        'copyright': 'assets/audio/credentials.mp3',
        'classified stark': 'assets/audio/research.mp3',
        'quantum-resistant': 'assets/audio/research.mp3',
        'clearance level seven': 'assets/audio/research.mp3',
        'security clearance verified': 'assets/audio/ironman.mp3',
        'i am iron man': 'assets/audio/iamironman_short.mp3',
        'gmrit': 'assets/audio/education.mp3',
        'completed his b.tech': 'assets/audio/education.mp3',
        'studies': 'assets/audio/education.mp3',
        'finished his studies': 'assets/audio/education.mp3',
        'ctiga': 'assets/audio/certifications.mp3',
        'certified threat intelligence': 'assets/audio/certifications.mp3',
        '1.9 years': 'assets/audio/experience.mp3',
        'yalamanchili solutions': 'assets/audio/experience.mp3',
        'react agent architecture': 'assets/audio/agent_engine.mp3',
        'autonomous on-device': 'assets/audio/agent_engine.mp3'
      };

      function getAudioPath(text) {
        const lower = text.toLowerCase();
        for (const [key, path] of Object.entries(audioMap)) {
          if (lower.includes(key)) {
            return path;
          }
        }
        return null;
      }

      function playBrowserTTS(rawText) {
        if (!('speechSynthesis' in window)) return;
        const clean = rawText
          .replace(/[🦾🛡️📜📱🌐🔑🔗🎓🎖️◈✓—–•*#]/g, ' ')
          .replace(/["'"`]/g, '')
          .replace(/\s+/g, ' ')
          .trim();

        if (!clean) return;

        const utterance = new SpeechSynthesisUtterance(clean);
        const voice = cachedBritishVoice || findBritishVoice();
        if (voice) {
          utterance.voice = voice;
          utterance.lang = voice.lang || 'en-GB';
        } else {
          utterance.lang = 'en-GB';
        }

        utterance.pitch = 0.95;
        utterance.rate = 1.0;
        utterance.volume = 1.0;

        window.speechSynthesis.speak(utterance);
      }

      window.speakJarvis = function(rawText) {
        if (!rawText) return;
        try {
          if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
          }
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }

          playStarkChime();

          const audioPath = getAudioPath(rawText);
          if (audioPath) {
            let base = document.querySelector('base') ? document.querySelector('base').getAttribute('href') : '';
            if (base && !base.endsWith('/')) base += '/';
            const fullSrc = (base ? base : '') + audioPath;

            currentAudio = new Audio(fullSrc);
            currentAudio.volume = 1.0;
            currentAudio.onerror = function() {
              const altSrc = (base ? base : '') + 'assets/' + audioPath;
              const altAudio = new Audio(altSrc);
              altAudio.volume = 1.0;
              currentAudio = altAudio;
              altAudio.play().catch(function() {
                playBrowserTTS(rawText);
              });
            };
            const playPromise = currentAudio.play();
            if (playPromise !== undefined) {
              playPromise.catch(function(err) {
                console.warn('Audio clip primary playback failed, trying alternate:', err);
                const altSrc = (base ? base : '') + 'assets/' + audioPath;
                const altAudio = new Audio(altSrc);
                altAudio.volume = 1.0;
                currentAudio = altAudio;
                altAudio.play().catch(function() {
                  playBrowserTTS(rawText);
                });
              });
            }
            return;
          }

          playBrowserTTS(rawText);
        } catch (e) {
          console.warn('JARVIS speech error:', e);
        }
      };

      window.stopJarvis = function() {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
          currentAudio = null;
        }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
